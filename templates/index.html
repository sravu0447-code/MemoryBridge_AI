<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryBridge AI</title>
</head>

<body>
    <h1>MemoryBridge AI</h1>

    <p>Preserve your memories. Retrieve them when you need them.</p>

    <form method="POST" action="/add-memory">
        <textarea
            name="memory"
            rows="6"
            cols="60"
            placeholder="Write a memory..."
            required
        ></textarea>

        <br><br>

        <button type="submit">Save Memory</button>
    </form>
</body>
</html>
